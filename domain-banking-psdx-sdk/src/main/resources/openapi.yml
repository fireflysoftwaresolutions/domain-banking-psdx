openapi: 3.0.3
info:
  title: Domain PSD2 API
  version: 1.0.0
  contact:
    name: Firefly Software Foundation
    email: dev@fireflysoftware.io
paths:
  /api/v1/consents/{id}:
    get:
      tags: [Consents]
      operationId: read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordView"
    put:
      tags: [Consents]
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordView"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Consents]
      operationId: remove
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Removed
  /api/v1/consents:
    post:
      tags: [Consents]
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordView"
      responses:
        "201":
          description: Created
components:
  schemas:
    RecordView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
