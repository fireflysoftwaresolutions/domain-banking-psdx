openapi: 3.0.3
info:
  title: Domain PSD2 API
  version: 26.10.5
paths:
  /api/v1/consents/{id}:
    get:
      tags: [Consents]
      operationId: read
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentView"
  /api/v1/consents/{id}/status:
    put:
      tags: [Consents]
      operationId: updateStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoredConsent"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredConsent"
  /api/v1/consents:
    post:
      tags: [Consents]
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDraft"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredConsent"
components:
  schemas:
    ConsentView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    StoredConsent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
    ConsentDraft:
      type: object
      additionalProperties: true
